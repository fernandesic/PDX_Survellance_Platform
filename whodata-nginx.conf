server {
    listen 80;
    server_name whodata.duckdns.org;

    # Required for Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

log_format timed '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time urt=$upstream_response_time';

server {
    listen 443 ssl;
    server_name whodata.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/whodata.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whodata.duckdns.org/privkey.pem;

    access_log /var/log/nginx/whodata-access.log timed;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 200M;

    root /var/www/frontend/dist;
    index index.html;

    # ── API Proxy: same-origin cookie fix ──
    # All /api/ requests are proxied to the Django backend.
    # This makes cookies first-party (same origin), fixing
    # Chrome incognito and third-party cookie blocking.
    location /api/ {
        proxy_pass http://unix:/var/www/backend/run/backend.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Streaming Support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 200M;
    }

    # Serve frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

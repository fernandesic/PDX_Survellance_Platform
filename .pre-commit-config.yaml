# Pre-commit hooks for the PDX Health Platform monorepo.
#
# Install:
#   pip install pre-commit && pre-commit install
#
# Hooks run only on changed files. No tree-wide reformat is performed by
# `pre-commit install`; if you want to format the whole tree once, run:
#   pre-commit run --all-files
# in its own dedicated commit so the diff stays separate from logic changes.

repos:
  # ── House-keeping ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Backend (Python) — config lives in backend-main/pyproject.toml ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend-main/.*\.py$
      - id: ruff-format
        files: ^backend-main/.*\.py$

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend-main/.*\.py$
        args: [--config=backend-main/pyproject.toml]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend-main/.*\.py$
        args: [--settings-path=backend-main/pyproject.toml]

  # ── Frontend (TS/JS) ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend-main/.*\.(ts|tsx|js|jsx|json|css|scss|md|yml|yaml)$
        additional_dependencies:
          - prettier@3.3.3

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend-main)
        language: system
        entry: bash -c 'cd frontend-main && npx eslint --no-warn-ignored'
        files: ^frontend-main/.*\.(ts|tsx)$
        pass_filenames: true

  # ── Secret scan ─────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
